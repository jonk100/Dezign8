  <!-- Middle slider -->
  <line x1="3" y1="12" x2="15" y2="12" />
  <line x1="19" y1="12" x2="21" y2="12" />
  <circle cx="17" cy="12" r="2" />

  <!-- Bottom slider -->
  <line x1="3" y1="18" x2="7" y2="18" />
  <line x1="11" y1="18" x2="21" y2="18" />
  <circle cx="9" cy="18" r="2" />
</svg>