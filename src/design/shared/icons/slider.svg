  stroke-linecap="round"
  stroke-linejoin="round"
  aria-hidden="true"
>
  <!-- Top slider -->
  <line x1="3" y1="6" x2="9" y2="6" />
  <line x1="13" y1="6" x2="21" y2="6" />
